<title id="title">OCLAST: curriculum learning and osteoclast segmentation</title><desc id="desc">Conceptual segmentation diagram based on OCLAST: four sequential curriculum domains and separated multinucleated cell masks for counting and morphometric analysis. Authored schematic, not microscopy imagery or measured model output.</desc>
